name: Windows CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication_admission:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    uses: pgextwin/build/.github/workflows/chat-publication-readonly.yml@0fa5aee1ec711c2eaf43328514fdb51359359a2c
  windows:
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@a25419dc28026960ac5776e747e3760d19b5cd27
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
  windows_required:
    name: Windows required summary
    if: ${{ always() }}
    needs: [windows, publication_admission]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require success of all maintained PG14-18 Windows jobs
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.windows.result }}
          ADMISSION_RESULT: ${{ needs.publication_admission.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$ADMISSION_RESULT" = success

  # Reuse the fleet's already-validated candidate ZIP/SPDX/Grype verifier.
  # It is inert on normal PR and main/push runs, and never publishes a Release.
  candidate_report:
    name: Verify immutable Windows candidate ZIP, SBOM and Grype
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/') }}
    needs: windows
    permissions:
      contents: read
      actions: read
      issues: write
    uses: pgextwin/build/.github/workflows/verify-candidate.yml@ecf84241c1c4cd99fab3f964cb309f9c6e2a01f8
    with:
      matrix_result: ${{ needs.windows.result }}
