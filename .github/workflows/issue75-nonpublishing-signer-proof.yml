name: Issue75 one-time nonpublishing signed pgTAP Windows proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue75-nonpublishing-signer-proof.yml

# One-time, explicitly restricted; no Release, Tag, Publisher, catalog or Secrets.
# Recheck genuine signer on the protected canonical-name repair push; never publish.
permissions:
  contents: read

jobs:
  signed_build_only:
    name: Build PG14-18 and attest ZIP/SPDX only (NO RELEASE)
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@5756b3c5136a8bf4db710016cfe97555f0a71c6d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
