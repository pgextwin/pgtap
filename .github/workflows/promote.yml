name: Promote verified upstream candidate to attested Release (manual only)

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: Merged automation-owned immutable manifest-only candidate PR number
        required: true
        type: string
      candidate_run_id:
        description: Successful exact-head Windows candidate dispatch run ID
        required: true
        type: string
      decision_run_id:
        description: Completed upstream watch run holding candidate-decision artifact
        required: true
        type: string
      release_tag:
        description: New and NEVER-used Windows Release tag
        required: true
        type: string

concurrency:
  group: pgtap-human-release-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Invoke shared exact-SHA manual signed promotion
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/promote-verified-release.yml@6c628634601f1620283a81c0fb7d97b9ad9ec248
    with:
      candidate_pr: ${{ inputs.candidate_pr }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      decision_run_id: ${{ inputs.decision_run_id }}
      release_tag: ${{ inputs.release_tag }}
      # Human-initiated main workflow_dispatch with an explicit tag is the
      # deliberate authorization; do not ask for an extra magic-word input.
      # Keep the immutable shared gate's legacy PUBLISH compatibility contract.
      confirm_release: PUBLISH
    secrets:
      catalog_app_private_key: ${{ secrets.PGEXTWIN_CATALOG_APP_PRIVATE_KEY }}
