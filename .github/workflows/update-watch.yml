name: Upstream update watch (operator-requested)

# B2: only an explicit human request may create candidates.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only check (uncheck only for explicit candidate request)
        required: true
        type: boolean
        default: true
      confirm_update:
        description: Type UPDATE for a candidate request; leave blank for dry run
        required: false
        type: string
        default: ''
      expected_main_sha:
        description: Current protected main 40-character SHA for candidate request
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: on-demand-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Shared strict operator preflight and GET-only update watch
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/operator-update-readonly.yml@33853f3a4381bfc2d984fad371e5ba5c768595a5
    with:
      dry_run: ${{ inputs.dry_run }}
      confirm_update: ${{ inputs.confirm_update }}
      expected_main_sha: ${{ inputs.expected_main_sha }}
      detector_sha: acd6eb28be6d750e89b626fa4ccd4403e1265cd6

  watch_candidate:
    name: Explicit upstream check and Issue reconciliation
    needs: authorize
    if: ${{ needs.authorize.outputs.mode == 'candidate' }}
    permissions:
      contents: read
      issues: write
    uses: pgextwin/build/.github/workflows/check-extension-updates.yml@acd6eb28be6d750e89b626fa4ccd4403e1265cd6
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      dry_run: false

  candidate:
    name: Prepare requested SHA-pinned Windows candidate (never Release)
    needs: [authorize, watch_candidate]
    if: ${{ needs.authorize.outputs.mode == 'candidate' && needs.watch_candidate.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: pgextwin/build/.github/workflows/candidate-update.yml@c10b13d6a0917910bc5c0b90531f8e82fdebcdea
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      candidate_policy_path: config/candidate-build.json
      dry_run: false
