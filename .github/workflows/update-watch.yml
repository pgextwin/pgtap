name: Upstream candidate after verified central daily fleet scan

# Central hourly :00 UTC scans all 17; this candidate-only gate runs hourly :30 UTC.
# Formal PUBLISH remains separately authorized and Releases remain disabled.
on:
  schedule:
    - cron: "30 * * * *"
  push:
    branches: [main]
    paths:
      - "config/extension.json"
  workflow_run:
    workflows: ["Windows CI/CD"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verified-auto-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Read-only latest 17-fleet success and exact protected main preflight
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/operator-update-auto.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff
    with:
      detector_sha: acd6eb28be6d750e89b626fa4ccd4403e1265cd6

  watch_candidate:
    name: Explicit upstream check and Issue reconciliation
    needs: authorize
    if: ${{ needs.authorize.outputs.mode == 'candidate' }}
    permissions:
      contents: read
      issues: write
    uses: pgextwin/build/.github/workflows/check-extension-updates.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      dry_run: false

  candidate:
    name: Prepare requested SHA-pinned Windows candidate (never Release)
    needs: [authorize, watch_candidate]
    if: ${{ needs.authorize.outputs.mode == 'candidate' && needs.watch_candidate.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: pgextwin/build/.github/workflows/candidate-update.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      candidate_policy_path: config/candidate-build.json
      dry_run: false

  candidate_native_pr_audit:
    name: Verify completed native candidate CI without rerunning Windows builds
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.action == 'completed' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'Windows CI/CD' &&
          startsWith(github.event.workflow_run.head_branch, 'auto-candidate/') &&
          github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    uses: pgextwin/build/.github/workflows/verify-native-pr-candidate.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff
    with:
      ci_run_id: ${{ github.event.workflow_run.id }}

  candidate_main_merge_observation:
    name: Authenticate main merge and scheduled decision (NONPUBLISHING)
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.created == false &&
          github.event.deleted == false }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    uses: pgextwin/build/.github/workflows/automatic-postmerge-audit-readonly.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff

  candidate_attested_build:
    name: Attest original candidate after verified protected main merge (NO PUBLISH)
    needs: candidate_main_merge_observation
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.candidate_main_merge_observation.result == 'success' &&
          needs.candidate_main_merge_observation.outputs.verified_signed_build_intent == 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@5756b3c5136a8bf4db710016cfe97555f0a71c6d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  candidate_signed_audit:
    name: Independently verify signed candidate bytes and identity (NO PUBLISH)
    needs: [candidate_main_merge_observation, candidate_attested_build]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.candidate_main_merge_observation.outputs.verified_signed_build_intent == 'true' &&
          needs.candidate_attested_build.result == 'success' }}
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: pgextwin/build/.github/workflows/verify-signed-candidate-readonly.yml@9ec4dde0b6defabc10cf3527c06cb69c13e5a7ff

# GitHub native Auto-merge via GITHUB_TOKEN was proven to merge without triggering
# a protected-main push Windows CI (PR #41, merge d48f8e8). Fail closed: do not
# deploy that path until a provenance-preserving principal is demonstrated.
# The existing hourly Chat GitHub connector uses expected-head protected Squash
# and produces genuine push CI without new Secrets or App permissions.
